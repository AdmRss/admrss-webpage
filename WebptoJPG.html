<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local WebP to JPG Converter</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2.5rem 1.5rem;
            cursor: pointer;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--primary-color);
            background-color: rgba(0, 123, 255, 0.03);
        }

        .drop-zone p {
            margin: 0;
            font-weight: 500;
        }

        #file-input {
            display: none;
        }

        .file-info {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: bold;
            color: #28a745;
            display: none;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #conversion-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WebP to JPG Converter</h1>
        <p>100% aman. Foto diproses secara lokal di perangkat kalian.</p>

        <div class="drop-zone" id="drop-zone">
            <p>Drag & drop file foto WebP di sini atau <span style="color: var(--primary-color); text-decoration: underline;">unggah</span></p>
            <input type="file" id="file-input" accept=".webp">
        </div>

        <div class="file-info" id="file-info"></div>

        <button class="btn" id="convert-btn" disabled>Konversi dan Download</button>
    </div>

    <canvas id="conversion-canvas"></canvas>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const convertBtn = document.getElementById('convert-btn');
        const canvas = document.getElementById('conversion-canvas');
        const ctx = canvas.getContext('2d');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelection(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelection(e.target.files[0]);
            }
        });

        function handleFileSelection(file) {
            if (file.type !== 'image/webp' && !file.name.endsWith('.webp')) {
                alert('Please select a valid .webp image file.');
                return;
            }
            selectedFile = file;
            fileInfo.textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            fileInfo.style.display = 'block';
            convertBtn.disabled = false;
        }

        convertBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            const reader = new FileReader();

            reader.onload = function(event) {
                const img = new Image();

                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;

                    // Fill background with white in case WebP has transparency
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Draw the decoded WebP onto the canvas
                    ctx.drawImage(img, 0, 0);

                    // Convert canvas to JPG string (0.90 is the quality setting)
                    const jpgDataUrl = canvas.toDataURL('image/jpeg', 0.90);

                    // Create an invisible download link and trigger it
                    const downloadLink = document.createElement('a');
                    const originalName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) || selectedFile.name;
                    
                    downloadLink.download = `${originalName}.jpg`;
                    downloadLink.href = jpgDataUrl;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                };

                img.src = event.target.result;
            };

            reader.readAsDataURL(selectedFile);
        });
    </script>
</body>
</html>
