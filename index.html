<!DOCTYPE html>
<html lang="en" theme="dark">  
    <head>
        <meta charSet="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AdmRss Page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" rel="stylesheet">
        <style>
            :root {
                --background-color: #f2eae0;
                --card-color: #f6c7b3;
                --text-color: #82b3c0;
                --hover-color: #c3dedd;
                --utama-color: #f0e2c3;
                --kedua-hover: #dcece9;
            }

            *, *::before, *::after {
                box-sizing: border-box; 
            }

            body {
                background-color: #ffffff;
                flex-direction: column;
                display: flex; 
                align-items: center;
                font-family: 'inter', sans-serif;
                min-height: auto;
                width: 100%;
                margin: 0;
                padding: 0;
            }

            .container-foto {
                max-width: 768px;
                height: 256px;
                width: 100%;
                margin: 0 auto;
                padding: 3rem 30px 48px;
            }

            .wrapper-foto {
                position: relative;
                max-width: 100%;
                height: 160px;
                width: 720px;
            }

            .avatar {
                position: absolute;
                bottom: -50px;
                right: 20px;
                height: 6.5rem;
                width: 6.5rem;
                border-radius: 2.5rem;
                overflow: hidden;
                box-shadow:  0px 15px 24px rgba(0, 0, 0, 0);
                z-index: 5;
            }

            .fotonya {
                width: 100%;
                height: 100%;
                overflow: hidden;
                border-radius: 0.8rem ;
            }

            .biography {
                max-width: 768px;
                width: 100%;
                margin: 0 auto;
                padding: 0rem 30px 48px;
                justify-content: center;
            }

            .seputar-saya {
                max-width: 85%;
            }

            h1 {
                font-size: 3.0rem;
                color: #111111;
                letter-spacing: -0.2rem;
                font-weight: 360;
                margin: 0 0 0.5rem 0;
                line-height: 1;
            }

            h2 {
                color: #111111;
                margin: 4rem 0 0.5rem 0;
                letter-spacing: -0.08rem;
            }

            p {
                margin: 0rem 0 1rem 0;
                font-size: 1.2rem;
                letter-spacing: 0.02rem;
                font-weight: 549;
                line-height: 1.4;
            }

            .projects {
                height: 34.5rem;
                width: 100%;
                padding: 0 1rem 0;
            }

            .container-project {
                border-radius: 1.5rem;
                box-shadow: #111111;
                background-color: #f5f5f5;
                height: 100%;
                width: 100%;
                display: block;
            }

            .container-experience {
                width: 100%;
                height: 100%;
                min-height: 900px;
                padding: 3rem 2rem 3rem 2rem;
                display: flex;
                flex-direction: column;
                margin: 0 auto;
                max-width: 768px;
            }
            .list-experience {
                width: 100%;
                min-height: 100%;
                height: 100%;
            }

            .judul-experience {
                justify-items: center;
                height: 30px;
            }

            h3 {
                font-weight:1220;
                font-size: 1.5rem;
                letter-spacing: -0.025rem;
            }
        </style>
    </head>
    <!-- <div align='center'> <img src="images/Capture.JPG" alt="logo header"><br/>
   </div> --> 
    <body>
        <div class="container-foto">
            <div class="wrapper-foto">
                <div class="fotonya">
                    <img src="images/kotaLama.jpg" alt="a semarang's beauty" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="avatar">
                    <img src="images/adamkecil.jpeg" alt="adam" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>
        </div>
        <section class="biography">
            <div class="seputar-saya">
                <h1><span><strong>Hi, I'm Adam 👋</strong></span></h1>
                <p>Informatics undip, came from lombok, Indonesia.<br>who aspires to be a <span><strong>Fullstack Engineer.</strong></span></p>
                <h2>
                    What's ongoing 🪄
                </h2>
                <p>
                    undergraduate, while continously self developing with endless-ideas in mind.
                </p>
            </div>
        </section>
        <section class="projects">
            <div class="container-project"></div>
                <div></div>
        </section>
        <main class="container-experience">
            <div class="list-experience">
                <div class="judul-experience">
                    <h3>Work Experience</h3>
                </div>

                <div class="events-experience">
                    <div class="event-pertama">
                        TO BE CONTINUED
                    </div>
                </div>
                <hr>
            </div>
        </main> 
    </body>
</html>
