<!DOCTYPE html>
<html lang="en" theme="light">
    <head>
        <meta charSet="UTF-8">
        <meta name="viewport" content="initial-scale=1.0, width=device-width">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
        <title>project lengkap</title>
        <style>
            .body {
                background-color: aliceblue;
                width: 100%;
                height: 100%;
                font-family: 'Geist', sans-serif;
            }

            .info {
                font: 'Geist';
                padding: 2rem 3rem;
                margin: 15rem auto;
                width: 40%;
                background-color: #f5f5f5;
                border-radius: 1.5rem;
                box-shadow: 0 4px 10px rgba(17, 17, 17, 0.15);
            }

            .info .judul h2 {
                font-weight: 500;
                text-align: center;
                margin: 0rem 0 1rem 0;
                font-size: 1.7rem;
                letter-spacing: 0.02rem;
                font-weight: 400;
            }

            .info .kembali a {
                display: block;
                text-decoration: none;
                color: salmon;
                text-align: center;
                margin: 1rem 1rem;
                font-size: 1.1rem;
                letter-spacing: 0.02rem;
                font-weight: 350;
                line-height: 1.4;
            }

            .info .kembali a:hover {
                margin: 0 auto;
                padding: 0rem 1rem;
                width: fit-content;
                color: #007bff;
                background-color: #f0f0f0;
                border-radius: 0.5rem;
                transition: all 0.4s ease-out;
            }
        </style>        
    </head>
    <body>
        <div class="info">
            <div class="judul">
                <h2> 🛠️ under maintenance 🚧</h2>
            </div>
            <div class="kembali">
                <a href="index.html" class="a">back to home</a>
            </div>
        </div>
    </body>
</html>
